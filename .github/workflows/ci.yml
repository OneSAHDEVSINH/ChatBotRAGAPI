name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ChatBotRAGAPI.slnx

      - name: Build
        run: dotnet build ChatBotRAGAPI.slnx --no-restore --configuration Release -warnaserror

      # Tests need no Ollama, Qdrant or network (local AI fallback + in-memory store).
      - name: Test
        run: dotnet test --solution ChatBotRAGAPI.slnx --no-build --configuration Release --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
